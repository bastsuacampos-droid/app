name: Validar banco de charlas

# Lo que llega a main se descarga en los teléfonos: se valida antes.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - name: Pruebas unitarias (estructura y validación del banco)
        run: ./gradlew testDebugUnitTest
      - name: docs/BANCO_CHARLAS.md al día
        run: |
          python3 tools/generar_banco_md.py
          git diff --exit-code docs/BANCO_CHARLAS.md
