<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&display=swap');
    :root{
      --bg:#f7f5f2; --surface:#ffffff; --surface-alt:#efece5; --border:#e3ded2;
      --text:#231f1a; --text-soft:#6b6459; --charcoal:#242220; --charcoal2:#343029;
      --orange:#e8600c; --orange-dark:#c14f08; --amber:#f2b705; --green:#3f8f5f; --red:#c0392b;
    }
    *{ box-sizing:border-box; }
    body{ margin:0; font-family:'IBM Plex Sans', system-ui, sans-serif; color:var(--text); }
    a{ color:var(--orange); } a:hover{ color:var(--orange-dark); }
    .disp{ font-family:'Archivo', system-ui, sans-serif; }
  </style>
</helmet>

<div style="width:393px;height:852px;background:var(--bg);display:flex;flex-direction:column;overflow:hidden;position:relative;box-shadow:0 0 0 1px var(--border);">

  <div style="background:var(--charcoal);color:#fff;padding:20px 20px 14px;flex-shrink:0;">
    <div style="display:flex;align-items:center;gap:12px;margin-bottom:14px;">
      <svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14.5 5.5 8 12l6.5 6.5"/></svg>
      <div style="flex-grow:1;">
        <div class="disp" style="font-size:17px;font-weight:800;">Fotografías</div>
        <div style="font-size:11px;color:#c9c3b8;">8 fotos del parte N° 119</div>
      </div>
    </div>
    <div style="display:flex;gap:7px;overflow-x:auto;">
      <div style="background:var(--orange);color:#fff;font-size:11.5px;font-weight:700;padding:6px 12px;border-radius:20px;white-space:nowrap;">Todas</div>
      <div style="background:#3a362e;color:#c9c3b8;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;white-space:nowrap;">Frente 1</div>
      <div style="background:#3a362e;color:#c9c3b8;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;white-space:nowrap;">Frente 2</div>
      <div style="background:#3a362e;color:#c9c3b8;font-size:11.5px;font-weight:600;padding:6px 12px;border-radius:20px;white-space:nowrap;">Con anotaciones</div>
    </div>
  </div>

  <div style="flex:1;overflow-y:auto;padding:16px 20px 90px;">
    <div style="display:grid;grid-template-columns:1fr 1fr;gap:11px;">

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#9aa7ad 0%,#6c7a80 45%,#4a5257 100%);">
        <div style="position:absolute;left:8px;top:8px;background:var(--orange);color:#fff;border-radius:7px;padding:3px 7px;display:flex;align-items:center;gap:4px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l.9-3.6L16.6 4.7a1.5 1.5 0 0 1 2.1 0l.6.6a1.5 1.5 0 0 1 0 2.1L7.6 19.1 4 20z"/></svg>
          <span style="font-size:9px;font-weight:700;">Anotada</span>
        </div>
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Frente 1 · 08:14</div>
      </div>

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#c7b299 0%,#a3856a 45%,#6f5643 100%);">
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Frente 1 · 09:02</div>
      </div>

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#adb8a3 0%,#7f8f74 45%,#586a4d 100%);">
        <div style="position:absolute;left:8px;top:8px;background:var(--orange);color:#fff;border-radius:7px;padding:3px 7px;display:flex;align-items:center;gap:4px;">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M4 20l.9-3.6L16.6 4.7a1.5 1.5 0 0 1 2.1 0l.6.6a1.5 1.5 0 0 1 0 2.1L7.6 19.1 4 20z"/></svg>
          <span style="font-size:9px;font-weight:700;">Anotada</span>
        </div>
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Frente 2 · 10:35</div>
      </div>

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#a9b6c2 0%,#7c8b99 45%,#525d68 100%);">
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Frente 2 · 11:50</div>
      </div>

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#cbb490 0%,#a3835a 45%,#775f42 100%);">
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Planta · 13:20</div>
      </div>

      <div style="border-radius:14px;overflow:hidden;position:relative;aspect-ratio:1;background:linear-gradient(155deg,#9aa7ad 0%,#6c7a80 45%,#4a5257 100%);">
        <div style="position:absolute;left:8px;bottom:8px;color:#fff;font-size:10px;font-weight:600;text-shadow:0 1px 3px rgba(0,0,0,.5);">Frente 1 · 15:47</div>
      </div>
    </div>

    <div style="text-align:center;font-size:11.5px;color:var(--text-soft);margin-top:16px;">Toca una foto para anotarla o dibujar sobre ella</div>
  </div>

  <div style="position:absolute;right:20px;bottom:24px;width:56px;height:56px;border-radius:50%;background:var(--orange);display:flex;align-items:center;justify-content:center;box-shadow:0 8px 18px -6px rgba(232,96,12,.6);">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 8h3l1.5-2h7L17 8h3a1 1 0 0 1 1 1v9a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V9a1 1 0 0 1 1-1z"/><circle cx="12" cy="13" r="3.4"/></svg>
  </div>

</div>
</x-dc>
<script data-dc-script data-props='{}'>
class Component extends DCLogic {
  renderVals() {
    return {};
  }

</script>
</body>
</html>
